<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robridge Training</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            opacity: 0.7;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            font-size: 36px;
            margin: 0 0 8px;
        }

        .welcome p {
            color: #666;
        }

        .week {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .day {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day:last-child {
            border-bottom: none;
        }

        .day-name {
            font-weight: bold;
        }

        .session {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #aaa;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    <h1>ROB RIDGE</h1>
    <p>Training for watersports athletes</p>
</header>

<main>

    <div class="welcome">
        <h2>This Week</h2>
        <p>Plan your training. Build your streak.</p>
    </div>

    <div class="week">

        <div class="day">
            <div>
                <div class="day-name">Monday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Tuesday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Wednesday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Thursday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Friday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Saturday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

        <div class="day">
            <div>
                <div class="day-name">Sunday</div>
                <div class="session">No session planned</div>
            </div>
            <div class="checkbox"></div>
        </div>

    </div>

</main>

</body>
</html>
