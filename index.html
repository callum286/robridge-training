<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Robridge Training</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding: 30px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      color: #666;
    }

    /* NAVIGATION */

    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .nav a {
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      background: #ddd;
      color: #111;
      font-weight: bold;
      font-size: 14px;
    }

    .nav a.active {
      background: #111;
      color: white;
    }

    /* TRAINING DAYS */

    .day {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: 0.15s;
    }

    .day:hover {
      transform: translateY(-1px);
    }

    .day.today {
      border: 2px solid #111;
    }

    /*
      Previous and future days are grey,
      but the whole day is still editable.
    */

    .day.locked {
      background: #e2e2e2;
      color: #999;
      box-shadow: none;
    }

    .day.locked:hover {
      transform: translateY(-1px);
    }

    .day-info {
      flex: 1;
    }

    .day-name {
      font-weight: bold;
      font-size: 18px;
    }

    .today-label {
      font-size: 11px;
      font-weight: bold;
      margin-left: 8px;
      color: #666;
    }

    .session-title {
      margin-top: 5px;
      color: #666;
      font-size: 14px;
    }

    .locked .session-title {
      color: #999;
    }

    /* TICK BOX */

    .tick-box {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 2px solid #999;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: bold;

      flex-shrink: 0;
    }

    .today .tick-box {
      cursor: pointer;
    }

    .today .tick-box:hover {
      border-color: #111;
    }

    /* COMPLETED */

    .completed .tick-box {
      background: #111;
      border-color: #111;
      color: white;
    }

    /* LOCKED TICK BOX */

    .locked .tick-box {
      background: #cfcfcf;
      border: none;
      color: transparent;
      cursor: default;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 14px;
    }

    .modal-content h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      margin-top: 15px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .save {
      background: #111;
      color: white;
      flex: 1;
    }

    .cancel {
      background: #ddd;
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Robridge Training</h1>
      <p>Plan your training. Build your streak.</p>
    </header>

    <!-- NAVIGATION -->

   <div class="nav">
  <a href="index.html" class="active">Planner</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="notes.html">Notes</a>
  <a href="login.html">Login</a>
</div>

    <!-- WEEKLY PLANNER -->

    <div id="planner"></div>

  </div>


  <!-- EDIT TRAINING MODAL -->

  <div class="modal" id="modal">

    <div class="modal-content">

      <h2 id="modalDay"></h2>

      <label for="sessionTitle">
        Session title
      </label>

      <input
        id="sessionTitle"
        type="text"
        placeholder="e.g. Upper Body Strength"
      >

      <label for="trainingType">
        Training type
      </label>

      <select id="trainingType">

        <option value="Strength">Strength</option>
        <option value="Cardio">Cardio</option>
        <option value="Mobility">Mobility</option>
        <option value="On Water">On Water</option>
        <option value="Foiling">Foiling</option>
        <option value="Sailing">Sailing</option>
        <option value="Recovery">Recovery</option>
        <option value="Other">Other</option>

      </select>

      <label for="sessionDetails">
        Details
      </label>

      <textarea
        id="sessionDetails"
        placeholder="What are you doing in this session?"
      ></textarea>

      <div class="buttons">

        <button
          class="cancel"
          onclick="closeModal()"
        >
          Cancel
        </button>

        <button
          class="save"
          onclick="saveSession()"
        >
          Save session
        </button>

      </div>

    </div>

  </div>


  <script>

    const days = [
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",
      "Sunday"
    ];


    /* LOAD TRAINING PLAN */

    let training =
      JSON.parse(
        localStorage.getItem("robridgeTraining")
      ) || {};


    /* LOAD COMPLETION HISTORY */

    let completed =
      JSON.parse(
        localStorage.getItem("robridgeCompleted")
      ) || {};


    let selectedDay = null;


    /* GET TODAY'S WEEKDAY */

    function getTodayIndex() {

      const day = new Date().getDay();

      return day === 0 ? 6 : day - 1;

    }


    /* GET TODAY'S DATE */

    function getTodayKey() {

      const date = new Date();

      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

      const day =
        String(date.getDate())
        .padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    /* GET DATE FOR A DAY IN THIS WEEK */

    function getDateKeyForDay(dayIndex) {

      const today = new Date();

      const todayIndex =
        getTodayIndex();

      const difference =
        dayIndex - todayIndex;

      const date =
        new Date(today);

      date.setDate(
        today.getDate() + difference
      );

      const year =
        date.getFullYear();

      const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

      const day =
        String(date.getDate())
        .padStart(2, "0");

      return `${year}-${month}-${day}`;

    }


    /* DRAW PLANNER */

    function renderWeek() {

      const planner =
        document.getElementById("planner");

      planner.innerHTML = "";

      const todayIndex =
        getTodayIndex();


      days.forEach((day, index) => {

        const div =
          document.createElement("div");


        const isToday =
          index === todayIndex;


        const dateKey =
          getDateKeyForDay(index);


        const isCompleted =
          completed[dateKey] === true;


        div.className = "day";


        if (isToday) {
          div.classList.add("today");
        }


        /*
          Only the visual appearance is locked.
          The day itself remains editable.
        */

        if (!isToday) {
          div.classList.add("locked");
        }


        if (isCompleted) {
          div.classList.add("completed");
        }


        const session =
          training[day] || {};


        div.innerHTML = `

          <div class="day-info">

            <div class="day-name">

              ${day}

              ${
                isToday
                  ? '<span class="today-label">TODAY</span>'
                  : ''
              }

            </div>


            <div class="session-title">

              ${
                escapeHTML(
                  session.title ||
                  "No session planned"
                )
              }

            </div>

          </div>


          <div
            class="tick-box"
            onclick="toggleDay(${index}, event)"
          >

            ${
              isCompleted
                ? "✓"
                : ""
            }

          </div>

        `;


        /*
          Clicking ANYWHERE on the day
          except the tick box opens the editor.
        */

        div.addEventListener(
          "click",
          function(event) {

            if (
              event.target
                .classList
                .contains("tick-box")
            ) {
              return;
            }

            openEditor(index);

          }
        );


        planner.appendChild(div);

      });

    }


    /* TICK TODAY */

    function toggleDay(index, event) {

      event.stopPropagation();


      const todayIndex =
        getTodayIndex();


      /*
        Previous and future boxes
        simply do nothing.
      */

      if (index !== todayIndex) {
        return;
      }


      const todayKey =
        getTodayKey();


      if (completed[todayKey]) {

        delete completed[todayKey];

      } else {

        completed[todayKey] = true;

      }


      localStorage.setItem(
        "robridgeCompleted",
        JSON.stringify(completed)
      );


      renderWeek();

    }


    /* OPEN EDITOR */

    function openEditor(index) {

      selectedDay = index;


      const day =
        days[index];


      const session =
        training[day] || {};


      document.getElementById(
        "modalDay"
      ).textContent =
        `${day} Training`;


      document.getElementById(
        "sessionTitle"
      ).value =
        session.title || "";


      document.getElementById(
        "trainingType"
      ).value =
        session.type || "Strength";


      document.getElementById(
        "sessionDetails"
      ).value =
        session.details || "";


      document.getElementById(
        "modal"
      ).style.display = "flex";

    }


    /* CLOSE EDITOR */

    function closeModal() {

      document.getElementById(
        "modal"
      ).style.display = "none";


      selectedDay = null;

    }


    /* SAVE SESSION */

    function saveSession() {

      if (selectedDay === null) {
        return;
      }


      const day =
        days[selectedDay];


      training[day] = {

        title:
          document.getElementById(
            "sessionTitle"
          ).value,

        type:
          document.getElementById(
            "trainingType"
          ).value,

        details:
          document.getElementById(
            "sessionDetails"
          ).value

      };


      localStorage.setItem(
        "robridgeTraining",
        JSON.stringify(training)
      );


      closeModal();


      renderWeek();

    }


    /* PREVENT HTML IN SESSION TITLES */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /* CLOSE MODAL BY CLICKING OUTSIDE */

    document.getElementById(
      "modal"
    ).addEventListener(
      "click",
      function(event) {

        if (event.target === this) {
          closeModal();
        }

      }
    );


    /* START */

    renderWeek();

  </script>

</body>
</html>
