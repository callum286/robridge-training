<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Groups — Robridge Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 50px;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

.nav {
  display: flex;
  gap: 8px;
  margin: 20px 0 30px;
  flex-wrap: wrap;
}

.nav a {
  text-decoration: none;
  color: #555;
  background: #e9e9e9;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 20px;
}

.card p {
  color: #777;
  margin: 0;
  line-height: 1.5;
}

.group-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}

.group-actions button {
  flex: 1;
  border: none;
  padding: 13px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

.create {
  background: #111;
  color: white;
}

.join {
  background: #e9e9e9;
  color: #111;
}

.form-box {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #eee;
}

.form-box h3 {
  margin: 0 0 15px;
  font-size: 18px;
}

.form-box label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 6px;
}

.form-box input,
.form-box textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 14px;
  outline: none;
}

.form-box input:focus,
.form-box textarea:focus {
  border-color: #111;
}

.form-box textarea {
  min-height: 90px;
  resize: vertical;
}

.form-buttons {
  display: flex;
  gap: 10px;
}

.form-buttons button {
  flex: 1;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.primary-button {
  background: #111;
  color: white;
}

.secondary-button {
  background: #e9e9e9;
  color: #111;
}

.empty {
  text-align: center;
  padding: 30px 10px;
  color: #888;
}

.group-card {
  background: #f7f7f7;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.group-card h3 {
  margin: 0 0 5px;
  font-size: 18px;
}

.group-card p {
  margin: 0 0 12px;
  color: #777;
  font-size: 14px;
}

.group-code {
  display: inline-block;
  background: white;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

.success {
  background: #f0f0f0;
  border-radius: 10px;
  padding: 12px;
  margin-top: 14px;
  font-size: 14px;
  display: none;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Training Groups</h1>
    <div class="subtitle">
      Train together. Stay consistent.
    </div>
  </header>

  <div class="nav">
    <a href="index.html">Planner</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="notes.html">Notes</a>
  </div>

  <div class="card">

    <h2>Your Groups</h2>

    <div id="groupsList">
      <div class="empty" id="emptyMessage">
        You haven't joined a training group yet.
      </div>
    </div>

    <div class="group-actions">

      <button class="create" onclick="showCreateGroup()">
        Create Group
      </button>

      <button class="join" onclick="showJoinGroup()">
        Join Group
      </button>

    </div>

    <div id="groupForm" class="form-box" style="display:none;"></div>

    <div id="successMessage" class="success"></div>

  </div>

</div>

<script>

function getGroups() {
  return JSON.parse(localStorage.getItem("robridgeGroups") || "[]");
}

function saveGroups(groups) {
  localStorage.setItem("robridgeGroups", JSON.stringify(groups));
}

function generateCode() {
  const characters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";

  for (let i = 0; i < 6; i++) {
    code += characters.charAt(
      Math.floor(Math.random() * characters.length)
    );
  }

  return code;
}

function showCreateGroup() {

  const form = document.getElementById("groupForm");

  form.style.display = "block";

  form.innerHTML = `
    <h3>Create a training group</h3>

    <label for="groupName">Group name</label>

    <input
      type="text"
      id="groupName"
      placeholder="e.g. 29er Training Squad"
      maxlength="40"
    >

    <label for="groupDescription">Description</label>

    <textarea
      id="groupDescription"
      placeholder="What is this group for?"
      maxlength="150"
    ></textarea>

    <div class="form-buttons">

      <button
        class="primary-button"
        onclick="createGroup()"
      >
        Create Group
      </button>

      <button
        class="secondary-button"
        onclick="closeForm()"
      >
        Cancel
      </button>

    </div>
  `;

  document.getElementById("groupName").focus();
}

function showJoinGroup() {

  const form = document.getElementById("groupForm");

  form.style.display = "block";

  form.innerHTML = `
    <h3>Join a training group</h3>

    <label for="joinCode">Group code</label>

    <input
      type="text"
      id="joinCode"
      placeholder="Enter your group code"
      maxlength="6"
      style="text-transform: uppercase;"
    >

    <div class="form-buttons">

      <button
        class="primary-button"
        onclick="joinGroup()"
      >
        Join Group
      </button>

      <button
        class="secondary-button"
        onclick="closeForm()"
      >
        Cancel
      </button>

    </div>
  `;

  document.getElementById("joinCode").focus();
}

function createGroup() {

  const name = document.getElementById("groupName").value.trim();
  const description = document.getElementById("groupDescription").value.trim();

  if (!name) {
    alert("Please enter a group name.");
    return;
  }

  const groups = getGroups();

  const newGroup = {
    id: Date.now(),
    name: name,
    description: description || "Training group",
    code: generateCode(),
    members: 1
  };

  groups.push(newGroup);

  saveGroups(groups);

  closeForm();

  showSuccess(
    "Group created. Your group code is " + newGroup.code + "."
  );

  renderGroups();
}

function joinGroup() {

  const codeInput = document.getElementById("joinCode");

  const code = codeInput.value.trim().toUpperCase();

  if (!code) {
    alert("Please enter a group code.");
    return;
  }

  const groups = getGroups();

  const group = groups.find(
    group => group.code === code
  );

  if (group) {

    closeForm();

    showSuccess(
      "You've joined " + group.name + "."
    );

    renderGroups();

    return;
  }

  /*
    For now, joining by code creates a local group entry.
    Once we connect Supabase, this will instead search
    the shared database for the real group.
  */

  const joinedGroup = {
    id: Date.now(),
    name: "Training Group",
    description: "Joined training group",
    code: code,
    members: 1
  };

  groups.push(joinedGroup);

  saveGroups(groups);

  closeForm();

  showSuccess(
    "Group joined successfully."
  );

  renderGroups();
}

function closeForm() {

  const form = document.getElementById("groupForm");

  form.style.display = "none";
  form.innerHTML = "";
}

function showSuccess(message) {

  const success = document.getElementById("successMessage");

  success.textContent = message;
  success.style.display = "block";

  setTimeout(function() {
    success.style.display = "none";
  }, 5000);
}

function renderGroups() {

  const groups = getGroups();

  const list = document.getElementById("groupsList");

  if (groups.length === 0) {

    list.innerHTML = `
      <div class="empty" id="emptyMessage">
        You haven't joined a training group yet.
      </div>
    `;

    return;
  }

  list.innerHTML = groups.map(function(group) {

    return `
      <div class="group-card">

        <h3>${escapeHtml(group.name)}</h3>

        <p>
          ${escapeHtml(group.description)}
        </p>

        <span class="group-code">
          CODE: ${escapeHtml(group.code)}
        </span>

      </div>
    `;

  }).join("");
}

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

renderGroups();

</script>

</body>
</html>
