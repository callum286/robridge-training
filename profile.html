<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Profile — Robridge Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 50px;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

.nav {
  display: flex;
  gap: 8px;
  margin: 20px 0 30px;
  flex-wrap: wrap;
}

.nav a {
  text-decoration: none;
  color: #555;
  background: #e9e9e9;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  font-family: inherit;
  font-size: 15px;
  margin-bottom: 16px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 14px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.saved {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

.profile-preview {
  display: none;
}

.profile-name {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 5px;
}

.profile-subtitle {
  color: #777;
  margin-bottom: 18px;
}

.profile-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.profile-item:last-child {
  border-bottom: none;
}

.profile-label {
  font-size: 12px;
  color: #888;
  margin-bottom: 3px;
}

.profile-value {
  font-weight: 500;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Athlete Profile</h1>
    <div class="subtitle">Build your Robridge Training profile.</div>
  </header>

  <div class="nav">
    <a href="index.html">Planner</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="notes.html">Notes</a>
  </div>

  <div class="card">

    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Your name">

    <label for="disciplines">Disciplines</label>
    <input id="disciplines" type="text" placeholder="e.g. 29er, Wingfoil, Windsurf">

    <label for="className">Main class / sport</label>
    <input id="className" type="text" placeholder="e.g. 29er">

    <label for="club">Club / team</label>
    <input id="club" type="text" placeholder="Your club or team">

    <label for="goals">Current goals</label>
    <textarea id="goals" placeholder="What are you working towards?"></textarea>

    <label for="achievements">Achievements</label>
    <textarea id="achievements" placeholder="Results, events, qualifications or other achievements"></textarea>

    <button onclick="saveProfile()">Save Profile</button>

    <div class="saved" id="savedMessage">
      Profile saved.
    </div>

  </div>

  <div class="card profile-preview" id="profilePreview">

    <div class="profile-name" id="previewName"></div>

    <div class="profile-subtitle" id="previewDisciplines"></div>

    <div class="profile-item">
      <div class="profile-label">Main class / sport</div>
      <div class="profile-value" id="previewClass"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Club / team</div>
      <div class="profile-value" id="previewClub"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Current goals</div>
      <div class="profile-value" id="previewGoals"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Achievements</div>
      <div class="profile-value" id="previewAchievements"></div>
    </div>

  </div>

</div>

<script>

const profileKey = "robridgeProfile";

function saveProfile() {

  const profile = {
    name: document.getElementById("name").value.trim(),
    disciplines: document.getElementById("disciplines").value.trim(),
    className: document.getElementById("className").value.trim(),
    club: document.getElementById("club").value.trim(),
    goals: document.getElementById("goals").value.trim(),
    achievements: document.getElementById("achievements").value.trim()
  };

  localStorage.setItem(
    profileKey,
    JSON.stringify(profile)
  );

  renderProfile();

  const message =
    document.getElementById("savedMessage");

  message.style.display = "block";

  setTimeout(() => {
    message.style.display = "none";
  }, 2000);

}

function renderProfile() {

  const saved =
    JSON.parse(
      localStorage.getItem(profileKey)
    );

  if (!saved) {
    return;
  }

  document.getElementById("name").value =
    saved.name || "";

  document.getElementById("disciplines").value =
    saved.disciplines || "";

  document.getElementById("className").value =
    saved.className || "";

  document.getElementById("club").value =
    saved.club || "";

  document.getElementById("goals").value =
    saved.goals || "";

  document.getElementById("achievements").value =
    saved.achievements || "";

  document.getElementById("previewName").textContent =
    saved.name || "Athlete";

  document.getElementById("previewDisciplines").textContent =
    saved.disciplines || "";

  document.getElementById("previewClass").textContent =
    saved.className || "Not added";

  document.getElementById("previewClub").textContent =
    saved.club || "Not added";

  document.getElementById("previewGoals").textContent =
    saved.goals || "Not added";

  document.getElementById("previewAchievements").textContent =
    saved.achievements || "Not added";

  document.getElementById("profilePreview").style.display =
    "block";
}

renderProfile();

</script>

</body>
</html>
