<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Athlete Profile — Robridge Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 50px;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

.nav {
  display: flex;
  gap: 8px;
  margin: 20px 0 30px;
  flex-wrap: wrap;
}

.nav a {
  text-decoration: none;
  color: #555;
  background: #e9e9e9;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 14px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
textarea {
  width: 100%;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  font-family: inherit;
  font-size: 15px;
  margin-bottom: 16px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  border: none;
  background: #111;
  color: white;
  padding: 14px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.saved {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

.profile-preview {
  display: none;
}

.profile-name {
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 5px;
}

.profile-subtitle {
  color: #777;
  margin-bottom: 18px;
}

.profile-item {
  padding: 12px 0;
  border-bottom: 1px solid #eee;
}

.profile-item:last-child {
  border-bottom: none;
}

.profile-label {
  font-size: 12px;
  color: #888;
  margin-bottom: 3px;
}

.profile-value {
  font-weight: 500;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Athlete Profile</h1>
    <div class="subtitle">Build your Robridge Training profile.</div>
  </header>

  <div class="nav">
    <a href="index.html">Planner</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="notes.html">Notes</a>
    <a href="profile.html">Profile</a>
  </div>

  <div class="card">

    <label for="name">Name</label>
    <input id="name" type="text" placeholder="Your name">

    <label for="disciplines">Disciplines</label>
    <input id="disciplines" type="text" placeholder="e.g. 29er, Wingfoil, Windsurf">

    <label for="className">Main class / sport</label>
    <input id="className" type="text" placeholder="e.g. 29er">

    <label for="club">Club / team</label>
    <input id="club" type="text" placeholder="Your club or team">

    <label for="goals">Current goals</label>
    <textarea id="goals" placeholder="What are you working towards?"></textarea>

    <label for="achievements">Achievements</label>
    <textarea id="achievements" placeholder="Results, events, qualifications or other achievements"></textarea>

    <button onclick="saveProfile()">Save Profile</button>

    <div class="saved" id="savedMessage">
      Profile saved.
    </div>

  </div>

  <div class="card profile-preview" id="profilePreview">

    <div class="profile-name" id="previewName"></div>

    <div class="profile-subtitle" id="previewDisciplines"></div>

    <div class="profile-item">
      <div class="profile-label">Main class / sport</div>
      <div class="profile-value" id="previewClass"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Club / team</div>
      <div class="profile-value" id="previewClub"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Current goals</div>
      <div class="profile-value" id="previewGoals"></div>
    </div>

    <div class="profile-item">
      <div class="profile-label">Achievements</div>
      <div class="profile-value" id="previewAchievements"></div>
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://rkaheotrwwvwzsgwclaq.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qa1BtZNL0zzlcDbRLw1a7A_P8dyEGIF";

let accessToken = null;
let userId = null;


/* =========================
   GET LOGGED-IN USER
========================= */

async function getCurrentUser() {

  const session = JSON.parse(
    localStorage.getItem("robridgeSession")
  );

  if (!session || !session.access_token) {
    window.location.href = "login.html";
    return;
  }

  accessToken = session.access_token;

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken
      }
    }
  );

  if (!response.ok) {
    localStorage.removeItem("robridgeSession");
    window.location.href = "login.html";
    return;
  }

  const user = await response.json();

  if (!user.id) {
    window.location.href = "login.html";
    return;
  }

  userId = user.id;

  await loadProfile();
}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      encodeURIComponent(userId) +
      "&select=*",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      console.error(
        "Could not load profile:",
        await response.text()
      );
      return;
    }

    const profiles = await response.json();

    if (profiles.length === 0) {
      return;
    }

    const profile = profiles[0];

    document.getElementById("name").value =
      profile.name || "";

    document.getElementById("disciplines").value =
      profile.disciplines || "";

    document.getElementById("className").value =
      profile.class_name || "";

    document.getElementById("club").value =
      profile.club || "";

    document.getElementById("goals").value =
      profile.goals || "";

    document.getElementById("achievements").value =
      profile.achievements || "";

    renderProfile(profile);

  } catch (error) {

    console.error(
      "Profile loading error:",
      error
    );

  }
}


/* =========================
   SAVE PROFILE
========================= */

async function saveProfile() {

  if (!userId || !accessToken) {
    window.location.href = "login.html";
    return;
  }

  const profile = {

    name:
      document.getElementById("name").value.trim(),

    disciplines:
      document.getElementById("disciplines").value.trim(),

    class_name:
      document.getElementById("className").value.trim(),

    club:
      document.getElementById("club").value.trim(),

    goals:
      document.getElementById("goals").value.trim(),

    achievements:
      document.getElementById("achievements").value.trim()
  };


  const message =
    document.getElementById("savedMessage");

  message.textContent = "Saving...";
  message.style.display = "block";


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      encodeURIComponent(userId),
      {
        method: "PATCH",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },

        body: JSON.stringify(profile)
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Profile save error:",
        errorText
      );

      message.textContent =
        "Could not save profile.";

      return;
    }


    renderProfile(profile);

    message.textContent =
      "Profile saved.";

    setTimeout(() => {
      message.style.display = "none";
    }, 2000);


  } catch (error) {

    console.error(
      "Profile save error:",
      error
    );

    message.textContent =
      "Could not save profile.";
  }
}


/* =========================
   SHOW PROFILE PREVIEW
========================= */

function renderProfile(profile) {

  document.getElementById("previewName").textContent =
    profile.name || "Athlete";

  document.getElementById("previewDisciplines").textContent =
    profile.disciplines || "";

  document.getElementById("previewClass").textContent =
    profile.class_name || "Not added";

  document.getElementById("previewClub").textContent =
    profile.club || "Not added";

  document.getElementById("previewGoals").textContent =
    profile.goals || "Not added";

  document.getElementById("previewAchievements").textContent =
    profile.achievements || "Not added";

  document.getElementById("profilePreview").style.display =
    "block";
}


/* =========================
   START PAGE
========================= */

getCurrentUser();

</script>

</body>
</html>
