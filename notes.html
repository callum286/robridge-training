<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Robridge Training - Notes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
      padding: 30px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    header p {
      color: #666;
    }

    /* NAVIGATION */

    .nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .nav a {
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      background: #ddd;
      color: #111;
      font-weight: bold;
      font-size: 14px;
    }

    .nav a.active {
      background: #111;
      color: white;
    }

    /* NOTES */

    .note-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 15px;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 8px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .saved-note {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .saved-note h3 {
      margin-bottom: 6px;
    }

    .saved-note .date {
      font-size: 12px;
      color: #888;
      margin-bottom: 10px;
    }

    .saved-note p {
      white-space: pre-wrap;
      color: #444;
      line-height: 1.5;
    }

    .delete {
      margin-top: 12px;
      background: #ddd;
      color: #111;
      width: auto;
      padding: 8px 12px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 20px;
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Robridge Training</h1>
      <p>Training notes & conditions</p>
    </header>


    <!-- NAVIGATION -->

    <div class="nav">

      <a href="index.html">
        Planner
      </a>

      <a href="notes.html" class="active">
        Notes
      </a>

    </div>


    <!-- NEW NOTE -->

    <div class="note-box">

      <label for="noteTitle">
        Session
      </label>

      <input
        id="noteTitle"
        type="text"
        placeholder="e.g. 29er training"
      >


      <label for="noteText">
        Notes
      </label>

      <textarea
        id="noteText"
        placeholder="18 kts&#10;Tension: 25&#10;Sea state: choppy&#10;What went well...&#10;What to improve..."
      ></textarea>


      <button onclick="saveNote()">
        Save note
      </button>

    </div>


    <!-- SAVED NOTES -->

    <div id="notesList"></div>

  </div>


  <script>

    /*
      Load saved notes from the browser.
    */

    let notes =
      JSON.parse(
        localStorage.getItem("robridgeNotes")
      ) || [];


    /*
      Display all notes.
    */

    function renderNotes() {

      const list =
        document.getElementById("notesList");

      list.innerHTML = "";


      if (notes.length === 0) {

        list.innerHTML = `
          <div class="empty">
            No training notes yet.
          </div>
        `;

        return;
      }


      notes.forEach((note, index) => {

        const div =
          document.createElement("div");

        div.className = "saved-note";


        div.innerHTML = `

          <h3>
            ${escapeHTML(note.title)}
          </h3>

          <div class="date">
            ${escapeHTML(note.date)}
          </div>

          <p>
            ${escapeHTML(note.text)}
          </p>

          <button
            class="delete"
            onclick="deleteNote(${index})"
          >
            Delete
          </button>

        `;


        list.appendChild(div);

      });

    }


    /*
      Save a new note.
    */

    function saveNote() {

      const title =
        document.getElementById(
          "noteTitle"
        ).value.trim();


      const text =
        document.getElementById(
          "noteText"
        ).value.trim();


      if (!title && !text) {
        return;
      }


      const date =
        new Date().toLocaleDateString(
          "en-GB",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );


      notes.unshift({

        title: title || "Training note",

        text: text,

        date: date

      });


      localStorage.setItem(
        "robridgeNotes",
        JSON.stringify(notes)
      );


      document.getElementById(
        "noteTitle"
      ).value = "";


      document.getElementById(
        "noteText"
      ).value = "";


      renderNotes();

    }


    /*
      Delete a note.
    */

    function deleteNote(index) {

      notes.splice(index, 1);


      localStorage.setItem(
        "robridgeNotes",
        JSON.stringify(notes)
      );


      renderNotes();

    }


    /*
      Prevent HTML being inserted
      into notes.
    */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }


    /*
      Start page.
    */

    renderNotes();

  </script>

</body>
</html>
