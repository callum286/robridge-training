<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Robridge Training</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      margin-top: 0;
    }

    .intro {
      color: #666;
      margin-bottom: 25px;
    }

    /* WIND SETUPS */

    .wind-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 35px;
    }

    .wind-card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px 15px;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
    }

    .wind-card:hover {
      transform: translateY(-2px);
      border-color: #111;
    }

    .wind-card strong {
      display: block;
      font-size: 19px;
      margin-bottom: 7px;
    }

    .wind-card span {
      font-size: 13px;
      color: #777;
    }

    .saved {
      border-color: #111;
    }

    /* FORM */

    .panel {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 35px;
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 11px 18px;
      margin-top: 18px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.85;
    }

    .close-btn {
      background: #ddd;
      color: #111;
      margin-left: 8px;
    }

    /* NORMAL NOTES */

    .note-form {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 25px;
    }

.note {
  background: white;
  padding: 12px 15px;
  border-radius: 9px;
  margin-bottom: 8px;
  border: 1px solid #e5e5e5;
}

.note h3 {
  margin: 0 0 3px 0;
  font-size: 15px;
}

.note-date {
  color: #888;
  font-size: 11px;
  margin-bottom: 7px;
}

.note div:not(.note-date) {
  font-size: 13px;
  line-height: 1.45;
}

.note .delete {
  padding: 6px 10px;
  margin-top: 9px;
  font-size: 11px;
  border-radius: 6px;
}

    .delete {
      background: #ddd;
      color: #111;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Robridge Training</h1>

  <nav>
    <a href="index.html">Planner</a>
    <a href="notes.html">Notes</a>
  </nav>
</header>

<main>

  <h2>Rigging & Conditions</h2>

  <p class="intro">
    Save your setup for different wind strengths so you can quickly see what works.
  </p>

  <div class="wind-grid" id="windGrid"></div>

  <div class="panel" id="riggingPanel">

    <h3 id="selectedWind">Wind Setup</h3>

    <label for="shroud">Shroud Tension</label>
    <input type="text" id="shroud" placeholder="e.g. 25">

    <label for="forestay">Forestay / Mast Setup</label>
    <input type="text" id="forestay" placeholder="e.g. 3 holes from top">

    <label for="rake">Mast Rake</label>
    <input type="text" id="rake" placeholder="Enter setup">

    <label for="cunningham">Cunningham</label>
    <input type="text" id="cunningham" placeholder="Enter setup">

    <label for="outhaul">Outhaul</label>
    <input type="text" id="outhaul" placeholder="Enter setup">

    <label for="otherRigging">Other Setup Notes</label>
    <textarea id="otherRigging" placeholder="Anything else about this wind range..."></textarea>

    <button onclick="saveRigging()">Save Setup</button>
    <button class="close-btn" onclick="closeRigging()">Close</button>

  </div>


  <h2>Session Notes</h2>

  <div class="note-form">

    <label for="noteTitle">Session</label>
    <input type="text" id="noteTitle" placeholder="e.g. 29er training - WPNSA">

    <label for="noteText">Notes</label>
    <textarea id="noteText" placeholder="What happened? What did you learn? What should you work on next time?"></textarea>

    <button onclick="saveNote()">Save Note</button>

  </div>

  <div id="notesList"></div>

</main>


<script>

  /* -------------------------
     WIND SETUPS
  ------------------------- */

  const windRanges = [
    "0–5 kts",
    "5–10 kts",
    "10–15 kts",
    "15–20 kts",
    "20–25 kts",
    "25–30 kts",
    "30–35 kts",
    "35–40 kts",
    "40–45 kts",
    "45–50 kts",
    "50+ kts"
  ];

  let selectedWind = null;

  const windGrid = document.getElementById("windGrid");

  function loadRigging() {
    return JSON.parse(localStorage.getItem("robridgeRigging") || "{}");
  }

  function renderWindCards() {

    const setups = loadRigging();

    windGrid.innerHTML = "";

    windRanges.forEach(range => {

      const card = document.createElement("div");

      card.className = "wind-card";

      if (setups[range]) {
        card.classList.add("saved");
      }

      card.innerHTML = `
        <strong>${range}</strong>
        <span>${setups[range] ? "Setup saved" : "Add setup"}</span>
      `;

      card.onclick = () => openRigging(range);

      windGrid.appendChild(card);
    });
  }


  function openRigging(range) {

    selectedWind = range;

    const setups = loadRigging();
    const setup = setups[range] || {};

    document.getElementById("selectedWind").textContent =
      range + " Setup";

    document.getElementById("shroud").value =
      setup.shroud || "";

    document.getElementById("forestay").value =
      setup.forestay || "";

    document.getElementById("rake").value =
      setup.rake || "";

    document.getElementById("cunningham").value =
      setup.cunningham || "";

    document.getElementById("outhaul").value =
      setup.outhaul || "";

    document.getElementById("otherRigging").value =
      setup.otherRigging || "";

    document.getElementById("riggingPanel").classList.add("active");

    window.scrollTo({
      top: document.getElementById("riggingPanel").offsetTop - 20,
      behavior: "smooth"
    });
  }


  function saveRigging() {

    if (!selectedWind) return;

    const setups = loadRigging();

    setups[selectedWind] = {

      shroud: document.getElementById("shroud").value,

      forestay: document.getElementById("forestay").value,

      rake: document.getElementById("rake").value,

      cunningham: document.getElementById("cunningham").value,

      outhaul: document.getElementById("outhaul").value,

      otherRigging: document.getElementById("otherRigging").value

    };

    localStorage.setItem(
      "robridgeRigging",
      JSON.stringify(setups)
    );

    renderWindCards();

    alert("Setup saved.");

  }


  function closeRigging() {

    document
      .getElementById("riggingPanel")
      .classList.remove("active");

    selectedWind = null;
  }


  /* -------------------------
     NORMAL NOTES
  ------------------------- */

  function loadNotes() {

    return JSON.parse(
      localStorage.getItem("robridgeNotes") || "[]"
    );

  }


  function saveNote() {

    const title =
      document.getElementById("noteTitle").value.trim();

    const text =
      document.getElementById("noteText").value.trim();

    if (!title || !text) {
      alert("Please enter a session and some notes.");
      return;
    }

    const notes = loadNotes();

    notes.unshift({

      title: title,

      text: text,

      date: new Date().toLocaleDateString("en-GB")

    });

    localStorage.setItem(
      "robridgeNotes",
      JSON.stringify(notes)
    );

    document.getElementById("noteTitle").value = "";
    document.getElementById("noteText").value = "";

    renderNotes();

  }


  function deleteNote(index) {

    const notes = loadNotes();

    notes.splice(index, 1);

    localStorage.setItem(
      "robridgeNotes",
      JSON.stringify(notes)
    );

    renderNotes();

  }


  function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }


  function renderNotes() {

    const notes = loadNotes();

    const container =
      document.getElementById("notesList");

    container.innerHTML = "";

    notes.forEach((note, index) => {

      const div = document.createElement("div");

      div.className = "note";

      div.innerHTML = `

        <h3>${escapeHTML(note.title)}</h3>

        <div class="note-date">
          ${escapeHTML(note.date)}
        </div>

        <div>
          ${escapeHTML(note.text).replace(/\n/g, "<br>")}
        </div>

        <button
          class="delete"
          onclick="deleteNote(${index})">
          Delete
        </button>

      `;

      container.appendChild(div);

    });

  }


  renderWindCards();
  renderNotes();

</script>

</body>
</html>
