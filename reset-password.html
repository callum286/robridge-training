<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Robridge Training</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  p {
    color: #666;
    line-height: 1.5;
  }

  label {
    display: block;
    margin-top: 20px;
    margin-bottom: 7px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  .back {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #666;
    text-decoration: none;
    font-size: 14px;
  }

  #message {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Reset password</h1>
  <p>
    Enter the email address linked to your Robridge Training account
    and we'll send you a password reset link.
  </p>

  <form id="resetForm">
    <label for="email">Email address</label>
    <input
      type="email"
      id="email"
      placeholder="you@example.com"
      required
    >

    <button type="submit">Send reset email</button>
  </form>

  <div id="message"></div>

  <a class="back" href="login.html">Back to login</a>
</div>

<script>
const SUPABASE_URL = "https://rkaheotrwwvwzsgwclaq.supabase.co";
const SUPABASE_KEY = "sb_publishable_qa1BtZNL0zzlcDbRLw1a7A_P8dyEGIF";

const form = document.getElementById("resetForm");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.display = "block";
  message.style.background = success ? "#e8f5e9" : "#fbe9e7";
  message.style.color = success ? "#1b5e20" : "#b71c1c";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Please enter your email address.");
    return;
  }

  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/recover",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY
        },
        body: JSON.stringify({
          email: email,
          redirect_to:
            "https://callum286.github.io/robridge-training/update-password.html"
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.msg || data.message || "Unable to send reset email.");
    }

    showMessage(
      "If an account exists for that email, a password reset email has been sent. Check your inbox.",
      true
    );

  } catch (error) {
    showMessage(error.message);
  }
});
</script>

</body>
</html>
