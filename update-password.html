<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose New Password — Robridge Training</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  p {
    color: #666;
    line-height: 1.5;
  }

  label {
    display: block;
    margin-top: 20px;
    margin-bottom: 7px;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
  }

  button {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #111;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.9;
  }

  #message {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    line-height: 1.4;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Choose a new password</h1>

  <p>
    Enter your new password below.
  </p>

  <form id="updateForm">

    <label for="password">New password</label>
    <input
      type="password"
      id="password"
      minlength="6"
      required
    >

    <label for="confirmPassword">Confirm new password</label>
    <input
      type="password"
      id="confirmPassword"
      minlength="6"
      required
    >

    <button type="submit">Update password</button>

  </form>

  <div id="message"></div>
</div>

<script>
const SUPABASE_URL = "https://rkaheotrwwvwzsgwclaq.supabase.co";
const SUPABASE_KEY = "sb_publishable_qa1BtZNL0zzlcDbRLw1a7A_P8dyEGIF";

const form = document.getElementById("updateForm");
const message = document.getElementById("message");

function showMessage(text, success = false) {
  message.textContent = text;
  message.style.display = "block";
  message.style.background = success ? "#e8f5e9" : "#fbe9e7";
  message.style.color = success ? "#1b5e20" : "#b71c1c";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if (password.length < 6) {
    showMessage("Your password must be at least 6 characters long.");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("The passwords do not match.");
    return;
  }

  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + getAccessToken()
        },
        body: JSON.stringify({
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.msg ||
        data.message ||
        "Unable to update your password."
      );
    }

    showMessage(
      "Password updated successfully. You can now log in with your new password.",
      true
    );

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);

  } catch (error) {
    showMessage(error.message);
  }
});

function getAccessToken() {
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);

  return params.get("access_token");
}
</script>

</body>
</html>
