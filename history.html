<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training History — Robridge Training</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #111;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 20px 50px;
}

header {
  margin-bottom: 25px;
}

h1 {
  margin: 0;
  font-size: 30px;
}

.subtitle {
  margin-top: 6px;
  color: #777;
}

.nav {
  display: flex;
  gap: 8px;
  margin: 20px 0 30px;
}

.nav a {
  text-decoration: none;
  color: #555;
  background: #e9e9e9;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
}

.nav a.active {
  background: #111;
  color: white;
}

.month {
  margin-top: 28px;
}

.month-title {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 10px;
}

.session {
  background: white;
  border-radius: 14px;
  padding: 15px 17px;
  margin-bottom: 9px;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.session:hover {
  transform: translateY(-1px);
}

.session-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.status {
  font-size: 16px;
}

.session-title {
  font-weight: bold;
  flex: 1;
}

.session-date {
  font-size: 13px;
  color: #888;
}

.session-type {
  margin-top: 5px;
  margin-left: 27px;
  font-size: 13px;
  color: #777;
}

.details {
  display: none;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid #eee;
  font-size: 14px;
  line-height: 1.5;
  color: #555;
}

.session.open .details {
  display: block;
}

.empty {
  background: white;
  border-radius: 14px;
  padding: 25px;
  text-align: center;
  color: #777;
}

/* Planned but incomplete */
.session.incomplete {
  opacity: 0.55;
}
</style>
</head>

<body>

<div class="container">

  <header>
    <h1>Training History</h1>
    <div class="subtitle">Look back at what you've done.</div>
  </header>

  <div class="nav">
    <a href="index.html">Planner</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="notes.html">Notes</a>
  </div>

  <div id="history"></div>

</div>

<script>

const training =
  JSON.parse(localStorage.getItem("robridgeTraining")) || {};

const completed =
  JSON.parse(localStorage.getItem("robridgeCompleted")) || {};

const historyContainer =
  document.getElementById("history");

const dayNames = [
  "Sunday",
  "Monday",
  "Tuesday",
  "Wednesday",
  "Thursday",
  "Friday",
  "Saturday"
];

function formatDate(date) {

  return date.toLocaleDateString("en-GB", {
    weekday: "short",
    day: "numeric",
    month: "short"
  });

}

function getMonday(date) {

  const d = new Date(date);
  const day = d.getDay();

  const difference = day === 0 ? -6 : 1 - day;

  d.setDate(d.getDate() + difference);

  d.setHours(0, 0, 0, 0);

  return d;

}

function getSessionForDate(date) {

  const dayName = dayNames[date.getDay()];

  return training[dayName];

}

function createSession(date) {

  const dayName = dayNames[date.getDay()];
  const session = training[dayName];

  if (!session) {
    return null;
  }

  const dateKey =
    date.toISOString().split("T")[0];

  const isCompleted =
    completed[dateKey] === true;

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "session" +
    (isCompleted ? "" : " incomplete");

  const top =
    document.createElement("div");

  top.className = "session-top";

  const status =
    document.createElement("div");

  status.className = "status";

  status.textContent =
    isCompleted ? "✓" : "○";

  const title =
    document.createElement("div");

  title.className = "session-title";

  title.textContent =
    session.title || "Training Session";

  const dateText =
    document.createElement("div");

  dateText.className = "session-date";

  dateText.textContent =
    formatDate(date);

  top.appendChild(status);
  top.appendChild(title);
  top.appendChild(dateText);

  const type =
    document.createElement("div");

  type.className = "session-type";

  type.textContent =
    session.type || "Training";

  const details =
    document.createElement("div");

  details.className = "details";

  details.textContent =
    session.details || "No session details added.";

  wrapper.appendChild(top);
  wrapper.appendChild(type);
  wrapper.appendChild(details);

  wrapper.addEventListener("click", () => {

    wrapper.classList.toggle("open");

  });

  return wrapper;

}

function renderHistory() {

  historyContainer.innerHTML = "";

  const today = new Date();

  today.setHours(0, 0, 0, 0);

  const startDate =
    new Date(today);

  startDate.setDate(
    startDate.getDate() - 365
  );

  const months = {};

  for (
    let date = new Date(startDate);
    date <= today;
    date.setDate(date.getDate() + 1)
  ) {

    const session =
      getSessionForDate(date);

    if (!session) {
      continue;
    }

    const dateKey =
      date.toISOString().split("T")[0];

    const isCompleted =
      completed[dateKey] === true;

    /*
      Only show sessions that have either:
      - been completed, or
      - are today/past planned sessions
    */

    const monthKey =
      date.getFullYear() +
      "-" +
      date.getMonth();

    if (!months[monthKey]) {

      months[monthKey] = {
        date: new Date(date),
        sessions: []
      };

    }

    months[monthKey].sessions.push({
      date: new Date(date),
      completed: isCompleted
    });

  }

  const monthList =
    Object.values(months).reverse();

  if (monthList.length === 0) {

    historyContainer.innerHTML = `
      <div class="empty">
        No training history yet.<br><br>
        Complete your first session and it will appear here.
      </div>
    `;

    return;

  }

  monthList.forEach(month => {

    const monthSection =
      document.createElement("div");

    monthSection.className = "month";

    const monthTitle =
      document.createElement("div");

    monthTitle.className =
      "month-title";

    monthTitle.textContent =
      month.date.toLocaleDateString("en-GB", {
        month: "long",
        year: "numeric"
      });

    monthSection.appendChild(monthTitle);

    month.sessions.reverse().forEach(item => {

      const session =
        createSession(item.date);

      if (session) {
        monthSection.appendChild(session);
      }

    });

    historyContainer.appendChild(monthSection);

  });

}

renderHistory();

</script>

</body>
</html>
